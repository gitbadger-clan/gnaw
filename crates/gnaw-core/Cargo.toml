[package]
name = "gnaw-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for gnaw: code-ingestion primitives, wire DTOs, and the staged prompt-assembly pipeline."
keywords = ["code", "ingestion", "prompt", "llm", "agent"]
categories = ["development-tools", "command-line-utilities"]
homepage = "https://gnaw.gitbadger.com"
documentation = "https://gnaw.gitbadger.com/tutorials/getting-started/"
exclude = [".github/*", ".assets/*"]
readme = "../../README.md"

[features]
default = []
compression = ["dep:tree-sitter", "dep:tree-sitter-rust"]
clap = ["dep:clap"]

[dependencies]
anyhow = { workspace = true }
aho-corasick = { workspace = true }
bracoxide = { workspace = true }
colored = { workspace = true }
clap = { workspace = true, optional = true, features = ["std", "derive"] }
csv = { workspace = true }
derive_builder = { workspace = true }
encoding_rs = { workspace = true }
indicatif = { workspace = true }
globset = { workspace = true }
handlebars = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
termtree = { workspace = true }
thiserror = { workspace = true }
tiktoken-rs = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }
chardetng = { workspace = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }

[lib]
name = "gnaw_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.2.2"
predicates = "3.1"
env_logger = "0.11.10"
rstest = "0.26.1"
