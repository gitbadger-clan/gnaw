[package]
name = "gnaw-adapters"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Concrete pipeline adapters (filesystem, git, tokenizing, rendering) for gnaw."
keywords = ["code", "ingestion", "prompt", "llm", "gnaw"]
categories = ["development-tools"]
readme = "../../README.md"

[features]
default = []
compression = ["gnaw-core/compression"]

[dependencies]
gnaw-core = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
git2 = { workspace = true }
ignore = { workspace = true }
content_inspector = { workspace = true }
rayon = { workspace = true }
termtree = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
rstest = "0.26.1"
criterion = "0.8"
