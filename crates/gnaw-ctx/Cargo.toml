[package]
name = "gnaw-ctx"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line and TUI tool that turns a codebase into an LLM-ready prompt (installs the `gnaw` binary)."
keywords = ["cli", "tui", "llm", "prompt", "gnaw"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://gnaw.gitbadger.com"
documentation = "https://gnaw.gitbadger.com/tutorials/getting-started/"
readme = "../../README.md"

[features]
default = ["compression"]
wayland = ["arboard/wayland-data-control"]
# Compression now reaches gnaw-adapters through gnaw-pipeline. The direct
# gnaw-adapters forward is kept so any adapter-gated code the CLI still touches
# directly stays enabled; drop it once gnaw-ctx no longer depends on
# gnaw-adapters directly.
compression = ["gnaw-pipeline/compression", "gnaw-adapters/compression"]

[dependencies]
gnaw-core = { workspace = true, features = ["clap"] }
gnaw-adapters = { workspace = true }
gnaw-pipeline = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
env_logger = { workspace = true }
arboard = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
inquire = { workspace = true }
terminal_size = { workspace = true }
lscolors = { workspace = true }
ansi_term = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
tui-tree-widget = { workspace = true }
ratatui-textarea = { workspace = true }
walkdir = { workspace = true }
unicode-width = { workspace = true }
bracoxide = { workspace = true }
git2 = { workspace = true }
globset = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
handlebars = { workspace = true }
ignore = { workspace = true }
tiktoken-rs = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true }

[[bin]]
name = "gnaw"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.2.2"
predicates = "3.1"
env_logger = "0.11.10"
rstest = "0.26"
