# Tag push -> create a GitHub Release with binaries, then publish to crates.io.

name: Gnaw Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write          # needed to create the release / attach binaries

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- 1. Quality gate — must pass before anything ships ----
  gate:
    name: Format, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Fail FAST if the pushed tag doesn't match the crate versions, *before*
      # the release is cut. The published version comes from Cargo.toml, not the
      # tag — without this a mis-bump cuts a GitHub Release and then dies at
      # `cargo publish` ("version already uploaded"), leaving an orphaned release.
      # With workspace inheritance all three resolve to [workspace.package].version.
      - name: Verify tag matches crate versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for crate in gnaw-core gnaw-adapters gnaw-ctx; do
            VER=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import sys,json;m=json.load(sys.stdin);print(next(p['version'] for p in m['packages'] if p['name']=='$crate'))")
            echo "$crate = $VER  (tag v$TAG)"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::Tag v$TAG does not match $crate version $VER — bump [workspace.package].version or fix the tag."
              exit 1
            fi
          done

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p gnaw-core -p gnaw-adapters -p gnaw-ctx --all-targets --locked -- -D warnings
      - run: cargo test  -p gnaw-core -p gnaw-adapters -p gnaw-ctx --locked

  # ---- 2. Build a release binary per target ----
  build:
    name: Build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}      # NB: "targets" (plural); "target" is silently ignored

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # libclang for any C-binding deps on Windows (kept from your original;
      # remove if the Windows build is green without it).
      - name: Cache LLVM on Windows
        if: runner.os == 'Windows'
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: C:\Program Files\LLVM
          key: windows-llvm-latest
      - name: Install LLVM on Windows
        if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm

      - name: Build
        run: cargo build --release -p gnaw-ctx --target ${{ matrix.target }} --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gnaw" "dist/gnaw-${{ matrix.target }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gnaw.exe" "dist/gnaw-${{ matrix.target }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: gnaw-${{ matrix.target }}
          path: dist/*

  # ---- 3. Create the GitHub Release with all binaries ----
  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true          # flatten every matrix artifact into ./dist

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in; no PAT needed

  # ---- 4. Publish crates, only after the release exists ----
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # Idempotent publish in dependency order: core <- adapters <- ctx.
      # Each crate is skipped if its current version already exists in the
      # crates.io sparse index, so a re-run after a mid-sequence failure
      # (token hiccup, flaky network) won't error with "already uploaded".
      # cargo (>=1.66) waits for each new version to land in the index before
      # returning, so the next crate resolves its path+version dep cleanly.
      - name: Publish (idempotent, in order)
        run: |
          set -euo pipefail
          publish() {
            local name=$1 ver idx
            ver=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import sys,json;m=json.load(sys.stdin);print(next(p['version'] for p in m['packages'] if p['name']=='$name'))")
            # crates.io sparse-index path (all gnaw crate names are >=4 chars)
            idx="https://index.crates.io/${name:0:2}/${name:2:2}/$name"
            if curl -s "$idx" | grep -q "\"vers\":\"$ver\""; then
              echo "$name@$ver already on crates.io — skipping"
            else
              echo "Publishing $name@$ver"
              cargo publish -p "$name" --locked
            fi
          }
          publish gnaw-core
          publish gnaw-adapters
          publish gnaw-ctx
